# Single-server deployment: app + PostgreSQL + ClamAV. Put a TLS-terminating reverse proxy
# (Caddy, nginx, a cloud load balancer) in front of port 3000. See docs/DEPLOYMENT.md.
services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://bookapp:${POSTGRES_PASSWORD}@db:5432/bookapp
      DATABASE_SSL: "false"
      CLAMAV_HOST: clamav
      MIGRATE_ON_START: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - storage:/var/lib/bookapp/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bookapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bookapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookapp"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped

volumes:
  pgdata:
  storage:
