<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="book">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{ogImage}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#16181d">
<link rel="icon" href="/assets/icon-192.png">
<link rel="stylesheet" href="/static/shared/base.css">
<link rel="stylesheet" href="/static/site/site.css">
</head>
<body>
<a class="sr-only" href="#main">Skip to content</a>
<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="/">{{siteName}}</a>
    <nav class="nav-links" aria-label="Sections">{{nav}}</nav>
    {{headerCta}}
  </div>
</header>
<main id="main">
  <section class="hero">
    <div class="wrap hero-inner">{{hero}}</div>
  </section>
  {{about}}
  {{learn}}
  {{author}}
  {{benefits}}
  {{testimonials}}
  {{faq}}
  {{finalCta}}
</main>
<footer class="footer"><div class="wrap">{{footer}}</div></footer>
</body>
</html>
