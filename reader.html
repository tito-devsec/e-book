<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Reader</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#111111">
<style>
body{margin:0;background:#1a1a1a;font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;color:#fff}
#book{position:relative;width:min(90vw,420px);height:min(78vh,620px);perspective:1800px;touch-action:pan-y;user-select:none}
.page{position:absolute;inset:0;background:#fbf6e9;color:#222;padding:32px 26px;transform-origin:left center;backface-visibility:hidden;border-radius:2px 8px 8px 2px;box-shadow:inset 8px 0 14px -10px rgba(0,0,0,.4);overflow:hidden}
.page h2{font-size:1.25rem;margin:0 0 14px}.page p{line-height:1.6;font-size:1.05rem}
.page .n{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:.8rem;color:#888}
.shade{position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.35),transparent);opacity:0;pointer-events:none}
.hint{margin-top:14px;font:.85rem system-ui;color:#999}
</style></head><body>
<div id="book"></div><div class="hint">Swipe or drag the page to turn</div>
<script src="book.js"></script><script src="reader.js"></script></body></html>
